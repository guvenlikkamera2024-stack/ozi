<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Signal Analysis Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #d1d4dc;
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(30, 34, 45, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .signal-card {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .signal-card.bullish {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }
        .signal-card.bearish {
            border-left-color: #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }
        .signal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .pulse-glow {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        }
        .chart-container {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .signal-timeline {
            position: relative;
            height: 60px;
            background: linear-gradient(90deg, #1e293b 0%, #334155 100%);
            border-radius: 8px;
            overflow: hidden;
        }
        .timeline-marker {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .timeline-marker.pre { background: #ffaa00; }
        .timeline-marker.current { background: #00ff88; }
        .timeline-marker.post { background: #4a90e2; }
        .metric-card {
            background: rgba(30, 34, 45, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            background: rgba(30, 34, 45, 0.8);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .confidence-bar {
            height: 8px;
            background: linear-gradient(90deg, #ff4444 0%, #ffaa00 50%, #00ff88 100%);
            border-radius: 4px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8">
    <div class="max-w-8xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <div class="flex items-center justify-center gap-3 mb-4">
                <i class="fas fa-chart-line text-4xl text-blue-400"></i>
                <h1 class="text-3xl md:text-4xl font-bold text-white">Professional Signal Analysis Scanner</h1>
            </div>
            <p class="text-gray-400 text-lg">Advanced signal timing, volume analysis, and chart integration</p>
            <div class="flex justify-center gap-4 mt-4">
                <div class="flex items-center gap-2 bg-green-900/30 px-3 py-1 rounded-full">
                    <div class="w-2 h-2 bg-green-400 rounded-full pulse-glow"></div>
                    <span class="text-sm text-green-300">Live Analysis</span>
                </div>
                <div class="flex items-center gap-2 bg-blue-900/30 px-3 py-1 rounded-full">
                    <i class="fas fa-brain text-blue-400"></i>
                    <span class="text-sm text-blue-300">AI Enhanced</span>
                </div>
            </div>
        </header>

        <!-- Control Panel -->
        <div class="glass-effect p-6 rounded-xl mb-6 shadow-2xl">
            <h2 class="text-xl font-semibold text-white mb-4 flex items-center gap-2">
                <i class="fas fa-cogs text-blue-400"></i>
                Signal Analysis Controls
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <button id="quickAnalysisBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-bolt"></i>
                    Quick Analysis
                </button>
                <button id="deepAnalysisBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-search-plus"></i>
                    Deep Analysis
                </button>
                <button id="signalScanBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-signal"></i>
                    Signal Scan
                </button>
                <button id="chartAnalysisBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-chart-area"></i>
                    Chart Analysis
                </button>
            </div>

            <!-- Advanced Filters -->
            <div class="bg-gray-800/50 p-4 rounded-lg border border-gray-700">
                <h3 class="text-lg font-semibold text-white mb-4">Advanced Signal Filters</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Min Confidence</label>
                        <input type="number" id="minConfidence" min="0" max="100" placeholder="70" class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Signal Quality</label>
                        <select id="signalQuality" class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-3 py-2">
                            <option value="all">All Qualities</option>
                            <option value="high">High Quality (80+)</option>
                            <option value="medium">Medium Quality (60-80)</option>
                            <option value="low">Low Quality (40-60)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Volume Filter</label>
                        <select id="volumeFilter" class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-3 py-2">
                            <option value="all">All Volumes</option>
                            <option value="high">High Volume</option>
                            <option value="spike">Volume Spike</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Timeframe</label>
                        <select id="timeframeFilter" class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-3 py-2">
                            <option value="5m">5 Minutes</option>
                            <option value="15m">15 Minutes</option>
                            <option value="1h">1 Hour</option>
                            <option value="4h">4 Hours</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button id="applyFilters" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md">Apply Filters</button>
                    <button id="resetFilters" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md">Reset</button>
                </div>
            </div>
        </div>

        <!-- Status and Progress -->
        <div id="status" class="text-center my-6"></div>
        <div id="loader" class="hidden flex justify-center items-center my-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-500 h-12 w-12"></div>
            <p class="ml-4 text-gray-300">Analyzing signals...</p>
        </div>

        <!-- Signal Analysis Results -->
        <div class="glass-effect p-6 rounded-xl mb-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                    <i class="fas fa-signal text-purple-400"></i>
                    Live Signal Analysis
                </h2>
                <div class="flex gap-2">
                    <button id="refreshSignals" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-md">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                    <button id="exportSignals" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                </div>
            </div>
            
            <div id="signalResults" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- Signal cards will be populated here -->
            </div>
        </div>

        <!-- Chart Analysis Modal -->
        <div id="chartModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="glass-effect p-6 rounded-xl shadow-2xl max-w-6xl w-full max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white" id="chartModalTitle">Chart Analysis</h3>
                    <button id="closeChartModal" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div id="chartContainer" class="chart-container">
                    <!-- Chart will be rendered here -->
                </div>
                <div id="chartAnalysis" class="mt-4">
                    <!-- Chart analysis will be shown here -->
                </div>
            </div>
        </div>

        <!-- Signal Details Modal -->
        <div id="signalModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="glass-effect p-6 rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white" id="signalModalTitle">Signal Details</h3>
                    <button id="closeSignalModal" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div id="signalDetails" class="space-y-4">
                    <!-- Signal details will be shown here -->
                </div>
            </div>
        </div>
    </div>

    <script src="signal_analysis.js"></script>
    <script src="chart_integration.js"></script>
    <script>
        // Initialize systems
        const signalAnalyzer = new SignalAnalyzer();
        const chartIntegration = new ChartIntegration();
        
        // Configuration
        const CONFIG = {
            API_BASE: 'https://fapi.binance.com',
            CONCURRENCY_LIMIT: 10,
            SIGNAL_UPDATE_INTERVAL: 30000, // 30 seconds
            MAX_SIGNALS_DISPLAY: 50
        };

        // DOM elements
        const loader = document.getElementById('loader');
        const statusEl = document.getElementById('status');
        const signalResults = document.getElementById('signalResults');
        const chartModal = document.getElementById('chartModal');
        const signalModal = document.getElementById('signalModal');

        // State
        let activeSignals = new Map();
        let signalUpdateInterval = null;

        // Initialize application
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Professional Signal Scanner initializing...');
            
            try {
                // Setup event listeners
                setupEventListeners();
                
                // Start signal monitoring
                startSignalMonitoring();
                
                console.log('✅ Professional Signal Scanner initialized successfully');
            } catch (error) {
                console.error('❌ Initialization error:', error);
            }
        });

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('quickAnalysisBtn').addEventListener('click', () => startQuickAnalysis());
            document.getElementById('deepAnalysisBtn').addEventListener('click', () => startDeepAnalysis());
            document.getElementById('signalScanBtn').addEventListener('click', () => startSignalScan());
            document.getElementById('chartAnalysisBtn').addEventListener('click', () => startChartAnalysis());
            
            document.getElementById('applyFilters').addEventListener('click', applyFilters);
            document.getElementById('resetFilters').addEventListener('click', resetFilters);
            
            document.getElementById('refreshSignals').addEventListener('click', refreshSignals);
            document.getElementById('exportSignals').addEventListener('click', exportSignals);
            
            document.getElementById('closeChartModal').addEventListener('click', () => chartModal.classList.add('hidden'));
            document.getElementById('closeSignalModal').addEventListener('click', () => signalModal.classList.add('hidden'));
        }

        // Start signal monitoring
        function startSignalMonitoring() {
            // Clear existing interval
            if (signalUpdateInterval) {
                clearInterval(signalUpdateInterval);
            }
            
            // Start new interval
            signalUpdateInterval = setInterval(() => {
                updateActiveSignals();
            }, CONFIG.SIGNAL_UPDATE_INTERVAL);
        }

        // Update active signals
        async function updateActiveSignals() {
            try {
                const symbols = await getSymbols();
                if (symbols.length === 0) return;

                // Analyze first 20 symbols for real-time updates
                const activeSymbols = symbols.slice(0, 20);
                
                for (const symbol of activeSymbols) {
                    const analysis = await signalAnalyzer.analyzeSignalTiming(symbol, '5m');
                    if (analysis && analysis.signalQuality > 60) {
                        activeSignals.set(symbol, analysis);
                    }
                }

                // Update display
                updateSignalDisplay();
            } catch (error) {
                console.error('Error updating signals:', error);
            }
        }

        // Start quick analysis
        async function startQuickAnalysis() {
            loader.classList.remove('hidden');
            statusEl.innerHTML = '<div class="text-blue-400">Quick signal analysis started...</div>';
            signalResults.innerHTML = '';

            try {
                const symbols = await getSymbols();
                if (symbols.length === 0) {
                    statusEl.innerHTML = '<div class="text-red-500">No symbols found</div>';
                    return;
                }

                const quickSymbols = symbols.slice(0, 15);
                statusEl.innerHTML = `<div class="text-blue-400">Analyzing ${quickSymbols.length} symbols...</div>`;

                for (const symbol of quickSymbols) {
                    const analysis = await signalAnalyzer.analyzeSignalTiming(symbol, '5m');
                    if (analysis) {
                        activeSignals.set(symbol, analysis);
                    }
                }

                updateSignalDisplay();
                statusEl.innerHTML = '<div class="text-green-500">Quick analysis completed!</div>';
            } catch (error) {
                console.error('Quick analysis error:', error);
                statusEl.innerHTML = '<div class="text-red-500">Quick analysis failed</div>';
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Start deep analysis
        async function startDeepAnalysis() {
            loader.classList.remove('hidden');
            statusEl.innerHTML = '<div class="text-indigo-400">Deep signal analysis started...</div>';
            signalResults.innerHTML = '';

            try {
                const symbols = await getSymbols();
                if (symbols.length === 0) {
                    statusEl.innerHTML = '<div class="text-red-500">No symbols found</div>';
                    return;
                }

                statusEl.innerHTML = `<div class="text-indigo-400">Deep analyzing ${symbols.length} symbols...</div>`;

                for (let i = 0; i < symbols.length; i += CONFIG.CONCURRENCY_LIMIT) {
                    const batch = symbols.slice(i, i + CONFIG.CONCURRENCY_LIMIT);
                    const promises = batch.map(symbol => signalAnalyzer.analyzeSignalTiming(symbol, '5m'));
                    const results = await Promise.all(promises);

                    results.forEach((analysis, index) => {
                        if (analysis && analysis.signalQuality > 50) {
                            activeSignals.set(batch[index], analysis);
                        }
                    });

                    const progress = Math.round(((i + CONFIG.CONCURRENCY_LIMIT) / symbols.length) * 100);
                    statusEl.innerHTML = `<div class="text-indigo-400">Deep analysis progress: ${Math.min(100, progress)}%</div>`;
                }

                updateSignalDisplay();
                statusEl.innerHTML = '<div class="text-green-500">Deep analysis completed!</div>';
            } catch (error) {
                console.error('Deep analysis error:', error);
                statusEl.innerHTML = '<div class="text-red-500">Deep analysis failed</div>';
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Start signal scan
        async function startSignalScan() {
            loader.classList.remove('hidden');
            statusEl.innerHTML = '<div class="text-purple-400">Signal scan started...</div>';
            signalResults.innerHTML = '';

            try {
                const symbols = await getSymbols();
                if (symbols.length === 0) {
                    statusEl.innerHTML = '<div class="text-red-500">No symbols found</div>';
                    return;
                }

                const signalSymbols = symbols.slice(0, 25);
                statusEl.innerHTML = `<div class="text-purple-400">Scanning signals for ${signalSymbols.length} symbols...</div>`;

                for (const symbol of signalSymbols) {
                    const analysis = await signalAnalyzer.analyzeSignalTiming(symbol, '5m');
                    if (analysis && analysis.isStrongSignal) {
                        activeSignals.set(symbol, analysis);
                    }
                }

                updateSignalDisplay();
                statusEl.innerHTML = '<div class="text-green-500">Signal scan completed!</div>';
            } catch (error) {
                console.error('Signal scan error:', error);
                statusEl.innerHTML = '<div class="text-red-500">Signal scan failed</div>';
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Start chart analysis
        async function startChartAnalysis() {
            if (activeSignals.size === 0) {
                statusEl.innerHTML = '<div class="text-yellow-400">No signals available for chart analysis. Run analysis first.</div>';
                return;
            }

            // Show chart modal with first signal
            const firstSignal = Array.from(activeSignals.values())[0];
            showChartModal(firstSignal.symbol);
        }

        // Update signal display
        function updateSignalDisplay() {
            const signals = Array.from(activeSignals.values())
                .sort((a, b) => b.signalQuality - a.signalQuality)
                .slice(0, CONFIG.MAX_SIGNALS_DISPLAY);

            signalResults.innerHTML = signals.map(signal => createSignalCard(signal)).join('');
        }

        // Create signal card
        function createSignalCard(signal) {
            const signalType = signal.currentSignal?.priceChange > 0 ? 'bullish' : 'bearish';
            const confidence = Math.round(signal.confidence * 100);
            const quality = Math.round(signal.signalQuality);
            
            return `
                <div class="signal-card ${signalType} p-4 rounded-lg cursor-pointer" onclick="showSignalDetails('${signal.symbol}')">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="text-lg font-bold text-white">${signal.symbol}</h3>
                            <p class="text-sm text-gray-400">${signal.timeframe} • ${new Date(signal.timestamp).toLocaleTimeString()}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-bold ${signalType === 'bullish' ? 'text-green-400' : 'text-red-400'}">
                                ${signalType === 'bullish' ? '↗' : '↘'}
                            </div>
                            <div class="text-xs text-gray-400">${signal.isNewSignal ? 'NEW' : 'CONTINUED'}</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-3">
                        <div class="metric-card">
                            <div class="text-xs text-gray-400 mb-1">Signal Quality</div>
                            <div class="text-lg font-bold ${quality > 70 ? 'text-green-400' : quality > 50 ? 'text-yellow-400' : 'text-red-400'}">
                                ${quality}%
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="text-xs text-gray-400 mb-1">Confidence</div>
                            <div class="text-lg font-bold ${confidence > 70 ? 'text-green-400' : confidence > 50 ? 'text-yellow-400' : 'text-red-400'}">
                                ${confidence}%
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="text-xs text-gray-400 mb-1">Confidence Level</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${100 - confidence}%"></div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center">
                        <div class="flex gap-2">
                            <button onclick="showChartModal('${signal.symbol}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs">
                                <i class="fas fa-chart-area mr-1"></i>Chart
                            </button>
                            <button onclick="showSignalDetails('${signal.symbol}')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-xs">
                                <i class="fas fa-info-circle mr-1"></i>Details
                            </button>
                        </div>
                        <div class="text-xs text-gray-400">
                            ${signal.isStrongSignal ? 'STRONG' : 'NORMAL'}
                        </div>
                    </div>
                </div>
            `;
        }

        // Show chart modal
        async function showChartModal(symbol) {
            chartModal.classList.remove('hidden');
            document.getElementById('chartModalTitle').textContent = `${symbol} - Chart Analysis`;
            
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '<div class="text-center text-gray-400">Loading chart...</div>';
            
            try {
                const chart = await chartIntegration.createChart(symbol, 'chartContainer', '5m');
                if (chart) {
                    // Add signal markers
                    const signal = activeSignals.get(symbol);
                    if (signal) {
                        chartIntegration.addSignalMarker(symbol, {
                            timestamp: new Date(signal.timestamp),
                            price: signal.currentSignal?.price || 0,
                            type: signal.currentSignal?.priceChange > 0 ? 'BUY' : 'SELL',
                            confidence: signal.confidence
                        });
                    }
                }
            } catch (error) {
                console.error('Chart creation error:', error);
                chartContainer.innerHTML = '<div class="text-center text-red-400">Chart creation failed</div>';
            }
        }

        // Show signal details
        function showSignalDetails(symbol) {
            const signal = activeSignals.get(symbol);
            if (!signal) return;

            signalModal.classList.remove('hidden');
            document.getElementById('signalModalTitle').textContent = `${symbol} - Signal Analysis Details`;
            
            const details = document.getElementById('signalDetails');
            details.innerHTML = createSignalDetailsHTML(signal);
        }

        // Create signal details HTML
        function createSignalDetailsHTML(signal) {
            const preSignal = signal.preSignal;
            const currentSignal = signal.currentSignal;
            const postSignal = signal.postSignal;

            return `
                <div class="space-y-6">
                    <!-- Signal Overview -->
                    <div class="bg-gray-800/50 p-4 rounded-lg">
                        <h4 class="text-lg font-semibold text-white mb-3">Signal Overview</h4>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="text-center">
                                <div class="text-2xl font-bold text-green-400">${Math.round(signal.signalQuality)}%</div>
                                <div class="text-xs text-gray-400">Quality</div>
                            </div>
                            <div class="text-center">
                                <div class="text-2xl font-bold text-blue-400">${Math.round(signal.confidence * 100)}%</div>
                                <div class="text-xs text-gray-400">Confidence</div>
                            </div>
                            <div class="text-center">
                                <div class="text-2xl font-bold ${signal.isNewSignal ? 'text-green-400' : 'text-yellow-400'}">
                                    ${signal.isNewSignal ? 'NEW' : 'CONT'}
                                </div>
                                <div class="text-xs text-gray-400">Type</div>
                            </div>
                            <div class="text-center">
                                <div class="text-2xl font-bold ${signal.isStrongSignal ? 'text-green-400' : 'text-gray-400'}">
                                    ${signal.isStrongSignal ? 'STRONG' : 'NORMAL'}
                                </div>
                                <div class="text-xs text-gray-400">Strength</div>
                            </div>
                        </div>
                    </div>

                    <!-- Pre-Signal Analysis -->
                    ${preSignal ? `
                    <div class="bg-gray-800/50 p-4 rounded-lg">
                        <h4 class="text-lg font-semibold text-white mb-3">Pre-Signal Analysis</h4>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Price Change</div>
                                <div class="text-lg font-bold ${preSignal.priceChange > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${preSignal.priceChange?.toFixed(2)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Volume Change</div>
                                <div class="text-lg font-bold ${preSignal.volumeChange > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${preSignal.volumeChange?.toFixed(2)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Volatility</div>
                                <div class="text-lg font-bold text-blue-400">
                                    ${preSignal.volatility?.toFixed(4)}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">RSI</div>
                                <div class="text-lg font-bold ${preSignal.rsi > 70 ? 'text-red-400' : preSignal.rsi < 30 ? 'text-green-400' : 'text-gray-400'}">
                                    ${preSignal.rsi?.toFixed(1)}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Momentum</div>
                                <div class="text-lg font-bold ${preSignal.momentum > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${preSignal.momentum?.toFixed(4)}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Trend Strength</div>
                                <div class="text-lg font-bold text-purple-400">
                                    ${Math.round((preSignal.trend?.strength || 0) * 100)}%
                                </div>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Current Signal Analysis -->
                    ${currentSignal ? `
                    <div class="bg-gray-800/50 p-4 rounded-lg">
                        <h4 class="text-lg font-semibold text-white mb-3">Current Signal Analysis</h4>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Price Change</div>
                                <div class="text-lg font-bold ${currentSignal.priceChange > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${currentSignal.priceChange?.toFixed(2)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Volume Spike</div>
                                <div class="text-lg font-bold ${currentSignal.volumeSpike ? 'text-green-400' : 'text-gray-400'}">
                                    ${currentSignal.volumeSpike ? 'YES' : 'NO'}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Breakout</div>
                                <div class="text-lg font-bold ${currentSignal.breakout ? 'text-green-400' : 'text-gray-400'}">
                                    ${currentSignal.breakout ? 'YES' : 'NO'}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Signal Strength</div>
                                <div class="text-lg font-bold text-blue-400">
                                    ${Math.round((currentSignal.signalStrength || 0) * 100)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Volume Confirmation</div>
                                <div class="text-lg font-bold ${currentSignal.volumeConfirmation ? 'text-green-400' : 'text-red-400'}">
                                    ${currentSignal.volumeConfirmation ? 'YES' : 'NO'}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Bollinger Position</div>
                                <div class="text-lg font-bold text-purple-400">
                                    ${Math.round((currentSignal.bollingerPosition || 0) * 100)}%
                                </div>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Post-Signal Analysis -->
                    ${postSignal ? `
                    <div class="bg-gray-800/50 p-4 rounded-lg">
                        <h4 class="text-lg font-semibold text-white mb-3">Post-Signal Analysis</h4>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Price Change</div>
                                <div class="text-lg font-bold ${postSignal.priceChange > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${postSignal.priceChange?.toFixed(2)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Signal Continuation</div>
                                <div class="text-lg font-bold ${postSignal.signalContinuation > 0.7 ? 'text-green-400' : 'text-red-400'}">
                                    ${Math.round((postSignal.signalContinuation || 0) * 100)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Profit/Loss</div>
                                <div class="text-lg font-bold ${postSignal.profitLoss > 0 ? 'text-green-400' : 'text-red-400'}">
                                    ${postSignal.profitLoss?.toFixed(2)}%
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Trend Reversal</div>
                                <div class="text-lg font-bold ${postSignal.trendReversal ? 'text-red-400' : 'text-green-400'}">
                                    ${postSignal.trendReversal ? 'YES' : 'NO'}
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="text-sm text-gray-400">Volume Confirmation</div>
                                <div class="text-lg font-bold ${postSignal.volumeConfirmation ? 'text-green-400' : 'text-red-400'}">
                                    ${postSignal.volumeConfirmation ? 'YES' : 'NO'}
                                </div>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Recommendations -->
                    ${signal.recommendations.length > 0 ? `
                    <div class="bg-gray-800/50 p-4 rounded-lg">
                        <h4 class="text-lg font-semibold text-white mb-3">Trading Recommendations</h4>
                        <div class="space-y-2">
                            ${signal.recommendations.map(rec => `
                                <div class="flex items-center gap-3 p-3 bg-gray-700/50 rounded-lg">
                                    <div class="w-3 h-3 rounded-full ${rec.type === 'ENTRY' ? 'bg-green-400' : rec.type === 'EXIT' ? 'bg-red-400' : 'bg-yellow-400'}"></div>
                                    <div class="flex-1">
                                        <div class="font-semibold text-white">${rec.action}</div>
                                        <div class="text-sm text-gray-400">${rec.reason}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm font-bold ${rec.confidence > 0.7 ? 'text-green-400' : rec.confidence > 0.5 ? 'text-yellow-400' : 'text-red-400'}">
                                            ${Math.round(rec.confidence * 100)}%
                                        </div>
                                        <div class="text-xs text-gray-400">${rec.riskLevel}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // Apply filters
        function applyFilters() {
            const minConfidence = parseInt(document.getElementById('minConfidence').value) || 0;
            const signalQuality = document.getElementById('signalQuality').value;
            const volumeFilter = document.getElementById('volumeFilter').value;
            const timeframe = document.getElementById('timeframeFilter').value;

            // Filter signals based on criteria
            const filteredSignals = Array.from(activeSignals.values()).filter(signal => {
                if (signal.confidence * 100 < minConfidence) return false;
                if (signalQuality !== 'all') {
                    const quality = signal.signalQuality;
                    if (signalQuality === 'high' && quality < 80) return false;
                    if (signalQuality === 'medium' && (quality < 60 || quality >= 80)) return false;
                    if (signalQuality === 'low' && quality >= 60) return false;
                }
                if (volumeFilter !== 'all') {
                    const volumeSpike = signal.currentSignal?.volumeSpike || false;
                    if (volumeFilter === 'spike' && !volumeSpike) return false;
                    if (volumeFilter === 'high' && !volumeSpike) return false;
                }
                return true;
            });

            // Update display with filtered signals
            signalResults.innerHTML = filteredSignals
                .sort((a, b) => b.signalQuality - a.signalQuality)
                .map(signal => createSignalCard(signal))
                .join('');

            statusEl.innerHTML = `<div class="text-blue-400">Showing ${filteredSignals.length} filtered signals</div>`;
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('minConfidence').value = '';
            document.getElementById('signalQuality').value = 'all';
            document.getElementById('volumeFilter').value = 'all';
            document.getElementById('timeframeFilter').value = '5m';
            updateSignalDisplay();
        }

        // Refresh signals
        function refreshSignals() {
            updateActiveSignals();
            statusEl.innerHTML = '<div class="text-blue-400">Signals refreshed</div>';
        }

        // Export signals
        function exportSignals() {
            const signals = Array.from(activeSignals.values());
            const csv = convertToCSV(signals);
            downloadCSV(csv, 'signals.csv');
        }

        // Convert signals to CSV
        function convertToCSV(signals) {
            const headers = ['Symbol', 'Timestamp', 'Quality', 'Confidence', 'Type', 'Strength', 'Price Change', 'Volume Change'];
            const rows = signals.map(signal => [
                signal.symbol,
                new Date(signal.timestamp).toISOString(),
                signal.signalQuality.toFixed(2),
                (signal.confidence * 100).toFixed(2),
                signal.isNewSignal ? 'NEW' : 'CONTINUED',
                signal.isStrongSignal ? 'STRONG' : 'NORMAL',
                signal.currentSignal?.priceChange?.toFixed(2) || 'N/A',
                signal.currentSignal?.volumeChange?.toFixed(2) || 'N/A'
            ]);
            
            return [headers, ...rows].map(row => row.join(',')).join('\n');
        }

        // Download CSV
        function downloadCSV(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // Get symbols from API
        async function getSymbols() {
            try {
                const response = await fetch(`${CONFIG.API_BASE}/fapi/v1/exchangeInfo`);
                const data = await response.json();
                return data.symbols
                    .filter(s => s.contractType === 'PERPETUAL' && s.quoteAsset === 'USDT' && !s.symbol.includes('_'))
                    .map(s => s.symbol);
            } catch (error) {
                console.error('Failed to fetch symbols:', error);
                statusEl.innerHTML = '<div class="text-red-500">Error: Unable to fetch symbols from Binance API</div>';
                return [];
            }
        }

        // Global functions for onclick handlers
        window.showChartModal = showChartModal;
        window.showSignalDetails = showSignalDetails;
    </script>
</body>
</html>
